name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official Android SDK packages
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?The runner must provide the Android SDK}}"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          sdkmanager --sdk_root="$sdk_root" "platforms;android-34" "build-tools;35.0.0"
      - name: Run web and host Java tests
        run: python3 scripts/test.py
      - name: Build and verify with an ephemeral local test key
        run: python3 scripts/build.py
      # No private signing secrets, device access, artifact upload, or release publication.
